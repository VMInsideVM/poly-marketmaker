{% extends "base.html" %}
{% block content %}
<div class="page-header">
    <h1>仪表盘</h1>
    <div class="controls">
        <button class="btn btn-success" onclick="engineAction('start-all')">全部启动</button>
        <button class="btn btn-danger" onclick="engineAction('stop-all', '止损监控将停止，确定要停止所有引擎吗？')">全部停止</button>
        <button class="btn btn-warning" onclick="engineAction('restart', '将重启所有引擎以加载新参数，确定吗？')">重启引擎</button>
    </div>
</div>

<div class="config-section" style="margin-bottom:16px;">
    <h3>手动调试</h3>
    <div class="controls">
        <button class="btn btn-sm btn-primary" onclick="engineAction('start-monitors')">启动监控</button>
        <button class="btn btn-sm btn-primary" onclick="scanMarkets()">扫描市场</button>
        <button class="btn btn-sm btn-success" onclick="placeOrders()">分发挂单</button>
        <button class="btn btn-sm btn-danger" onclick="cancelAllOrders()">全部撤单</button>
    </div>
</div>

<div class="summary-cards" id="summary">
    <div class="card"><h3>总挂单</h3><p id="total-orders">-</p></div>
    <div class="card"><h3>总持仓</h3><p id="total-positions">-</p></div>
    <div class="card"><h3>总盈亏</h3><p id="total-pnl">-</p></div>
</div>

<h2>钱包状态</h2>
<table class="data-table" id="wallet-table">
    <thead>
        <tr>
            <th>钱包地址</th>
            <th>余额 (pUSD)</th>
            <th>挂单数</th>
            <th>持仓数</th>
            <th>状态</th>
            <th>操作</th>
        </tr>
    </thead>
    <tbody id="wallet-body"></tbody>
</table>

<h2>符合条件的市场 (Eligible Markets)</h2>
<p id="scan-time" style="color:#888; font-size:13px;"></p>
<table class="data-table" id="eligible-table">
    <thead>
        <tr>
            <th onclick="sortEligible('#')" style="cursor:pointer"># ⇅</th>
            <th onclick="sortEligible('market_name')" style="cursor:pointer">市场名称 ⇅</th>
            <th onclick="sortEligible('outcome')" style="cursor:pointer">方向 ⇅</th>
            <th onclick="sortEligible('daily_reward')" style="cursor:pointer">每日奖励 ⇅</th>
            <th onclick="sortEligible('order_price')" style="cursor:pointer">挂单价格 ⇅</th>
            <th onclick="sortEligible('order_size')" style="cursor:pointer">挂单数量 ⇅</th>
            <th onclick="sortEligible('market_competitiveness')" style="cursor:pointer">Competitiveness ⇅</th>
        </tr>
    </thead>
    <tbody id="eligible-body"></tbody>
</table>
{% endblock %}

{% block scripts %}
<script>
function refreshDashboard() {
    fetch('/api/dashboard').then(r => r.json()).then(data => {
        document.getElementById('total-orders').textContent = data.total_orders;
        document.getElementById('total-positions').textContent = data.total_positions;
        document.getElementById('total-pnl').textContent = (data.total_pnl || 0).toFixed(2) + ' pUSD';
        const tbody = document.getElementById('wallet-body');
        tbody.innerHTML = data.wallets.map(w => `
            <tr>
                <td title="${w.address}">${w.address.slice(0,6)}...${w.address.slice(-4)}</td>
                <td>${w.balance != null ? w.balance.toFixed(2) : '-'}</td>
                <td>${w.open_orders}</td>
                <td>${w.positions}</td>
                <td><span class="status ${w.running ? 'running' : 'stopped'}">${w.running ? '运行中' : '已停止'}</span></td>
                <td>
                    ${w.running
                        ? `<button class="btn btn-sm btn-danger" onclick="walletAction('${w.address}', 'stop')">停止</button>`
                        : `<button class="btn btn-sm btn-success" onclick="walletAction('${w.address}', 'start')">启动</button>`
                    }
                </td>
            </tr>
        `).join('');
    });
}

function engineAction(action, confirmMsg) {
    if (confirmMsg && !confirm(confirmMsg)) return;
    fetch(`/api/engine/${action}`, {method: 'POST'}).then(r => r.json()).then(data => {
        if (data.message) alert(data.message);
        refreshDashboard();
    });
}

let scanPollTimer = null;
let eligibleData = [];
let eligibleSortKey = 'market_competitiveness';
let eligibleSortAsc = false;

function sortEligible(key) {
    if (key === '#') {
        // Reset to default order
        eligibleSortKey = null;
        renderEligibleTable();
        return;
    }
    if (eligibleSortKey === key) {
        eligibleSortAsc = !eligibleSortAsc;
    } else {
        eligibleSortKey = key;
        eligibleSortAsc = false;
    }
    renderEligibleTable();
}

function renderEligibleTable() {
    let sorted = [...eligibleData];
    if (eligibleSortKey) {
        sorted.sort((a, b) => {
            let va = a[eligibleSortKey] ?? '';
            let vb = b[eligibleSortKey] ?? '';
            if (typeof va === 'string') va = va.toLowerCase();
            if (typeof vb === 'string') vb = vb.toLowerCase();
            if (va < vb) return eligibleSortAsc ? -1 : 1;
            if (va > vb) return eligibleSortAsc ? 1 : -1;
            return 0;
        });
    }
    const tbody = document.getElementById('eligible-body');
    tbody.innerHTML = sorted.map((m, i) => `
        <tr>
            <td>${i + 1}</td>
            <td title="${m.market_id}">${m.market_name}</td>
            <td>${m.outcome}</td>
            <td>$${m.daily_reward.toFixed(2)}/天</td>
            <td>${m.order_price.toFixed(4)}</td>
            <td>${m.order_size}</td>
            <td>${m.market_competitiveness || '-'}</td>
        </tr>
    `).join('');
}

function scanMarkets() {
    document.getElementById('scan-time').textContent = '正在扫描...';
    fetch('/api/engine/scan', {method: 'POST'});
    // Start polling for progress while scan runs in background
    if (scanPollTimer) clearInterval(scanPollTimer);
    scanPollTimer = setInterval(pollScanProgress, 2000);
}

function pollScanProgress() {
    fetch('/api/eligible').then(r => r.json()).then(data => {
        const status = data.scan_status || 'idle';
        const progress = data.scan_progress || '';
        const checked = data.scan_checked || 0;
        const total = data.scan_total || 0;
        const markets = data.markets || [];

        if (status === 'scanning') {
            document.getElementById('scan-time').textContent =
                `扫描中 [${checked}/${total}] ${progress} (已找到 ${markets.length} 个)`;
        } else if (status === 'done') {
            document.getElementById('scan-time').textContent =
                `扫描完成: ${new Date(data.last_scan_time * 1000).toLocaleString('zh-CN')} (共 ${markets.length} 个)`;
            if (scanPollTimer) { clearInterval(scanPollTimer); scanPollTimer = null; }
        }

        eligibleData = markets;
        renderEligibleTable();
    });
}

function placeOrders() {
    if (!confirm('确定将 eligible 列表分发到所有钱包挂单？')) return;
    fetch('/api/engine/place-orders', {method: 'POST'}).then(r => r.json()).then(data => {
        refreshDashboard();
    });
}

function cancelAllOrders() {
    if (!confirm('确定撤销所有钱包的全部买单？')) return;
    fetch('/api/engine/cancel-all', {method: 'POST'}).then(r => r.json()).then(data => {
        refreshDashboard();
    });
}

function walletAction(address, action) {
    if (action === 'stop' && !confirm('止损监控将停止，确定要停止该钱包引擎吗？')) return;
    fetch(`/api/engine/${address}/${action}`, {method: 'POST'}).then(r => r.json()).then(data => {
        if (data.message) alert(data.message);
        refreshDashboard();
    });
}

function refreshEligible() {
    fetch('/api/eligible').then(r => r.json()).then(data => {
        const markets = data.markets || [];
        const scanTime = data.last_scan_time;
        if (scanTime) {
            document.getElementById('scan-time').textContent =
                `上次扫描: ${new Date(scanTime * 1000).toLocaleString('zh-CN')} (共 ${markets.length} 个)`;
        } else {
            document.getElementById('scan-time').textContent = '尚未扫描';
        }
        eligibleData = markets;
        renderEligibleTable();
    });
}

refreshDashboard();
refreshEligible();
setInterval(refreshDashboard, 5000);

// eligible 列表跟随后端扫描节奏：检测 last_scan_time 变化才刷新
let lastKnownScanTime = 0;
setInterval(() => {
    fetch('/api/eligible').then(r => r.json()).then(data => {
        if (data.last_scan_time && data.last_scan_time !== lastKnownScanTime) {
            lastKnownScanTime = data.last_scan_time;
            refreshEligible();
        }
    });
}, 10000);
</script>
{% endblock %}
