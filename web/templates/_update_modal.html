{# 手动检查更新弹窗:由"检查更新"按钮触发 checkForUpdate();不再页面加载时自动检测
   (自动检测会每次翻页都打 GitHub 未认证 API,易触发 60 次/小时限流)。 #}
<div id="update-modal" class="update-modal" style="display:none">
  <div class="update-box">
    <h2 id="update-title">检查更新</h2>
    <p id="update-msg" class="update-msg" style="display:none"></p>
    <pre id="update-notes" class="update-notes" style="display:none"></pre>
    <div id="update-progress-wrap" style="display:none">
      <div class="update-bar"><div id="update-bar-fill"></div></div>
      <p id="update-progress-text">准备中…</p>
    </div>
    <p id="update-error" class="update-error" style="display:none"></p>
    <div id="update-actions-update" class="update-actions" style="display:none">
      <button id="update-yes" class="btn btn-primary" type="button">是,现在更新</button>
      <button id="update-no" class="btn" type="button">稍后</button>
    </div>
    <div id="update-actions-close" class="update-actions" style="display:none">
      <button id="update-close" class="btn" type="button">关闭</button>
    </div>
  </div>
</div>
<script>
(function () {
  var modal = document.getElementById('update-modal');
  if (!modal) return;
  var $ = function (id) { return document.getElementById(id); };
  var INSTALL_MSG = '正在安装并自动重启,请稍候,几秒后程序会自动重新打开。';

  function hide(id) { $(id).style.display = 'none'; }
  function show(id, disp) { $(id).style.display = disp || 'block'; }

  function reset() {
    hide('update-msg'); hide('update-notes'); hide('update-progress-wrap');
    hide('update-error'); hide('update-actions-update'); hide('update-actions-close');
  }
  function closeModal() { modal.style.display = 'none'; }

  // 全局入口:由各页面的“检查更新”按钮调用
  window.checkForUpdate = function (btn) {
    if (btn) { btn.disabled = true; }
    reset();
    $('update-title').textContent = '正在检查更新…';
    modal.style.display = 'flex';
    fetch('/api/update/check')
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d.update_available) {
          $('update-title').textContent = '发现新版本 v' + d.latest + '(当前 v' + d.current + ')';
          $('update-notes').textContent = d.notes || '';
          show('update-notes'); show('update-actions-update', 'flex');
        } else if (d.latest) {
          $('update-title').textContent = '已是最新版本';
          $('update-msg').textContent = '当前版本 v' + d.current + ' 已是最新。';
          show('update-msg'); show('update-actions-close', 'flex');
        } else {
          // 后端吞掉异常时不带 latest 字段:多为网络问题或访问频繁(限流)
          $('update-title').textContent = '检查更新失败';
          $('update-msg').textContent = '无法连接 GitHub(可能是网络问题或访问过于频繁),请稍后再试。';
          show('update-msg'); show('update-actions-close', 'flex');
        }
      })
      .catch(function () {
        $('update-title').textContent = '检查更新失败';
        $('update-msg').textContent = '无法检查更新,请稍后再试。';
        show('update-msg'); show('update-actions-close', 'flex');
      })
      .then(function () { if (btn) { btn.disabled = false; } });
  };

  $('update-no').onclick = closeModal;
  $('update-close').onclick = closeModal;

  $('update-yes').onclick = function () {
    reset();
    $('update-title').textContent = '正在更新';
    show('update-progress-wrap');
    setProgress(0, '准备中…');
    fetch('/api/update/apply', { method: 'POST' })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (x) {
        if (!x.ok) { showApplyError(x.d.message || '更新失败'); return; }
        poll();
      })
      .catch(function () { showApplyError('无法启动更新,请稍后重试'); });
  };

  function setProgress(pct, text) {
    $('update-bar-fill').style.width = (pct || 0) + '%';
    $('update-progress-text').textContent = text;
  }

  function showApplyError(msg) {
    hide('update-progress-wrap');
    $('update-error').textContent = msg;
    show('update-error');
    show('update-actions-close', 'flex'); // 失败后让用户能关闭
  }

  function poll() {
    fetch('/api/update/status').then(function (r) { return r.json(); }).then(function (s) {
      if (s.state === 'downloading') setProgress(s.percent, '正在下载… ' + (s.percent || 0) + '%');
      else if (s.state === 'verifying') setProgress(100, '正在校验…');
      else if (s.state === 'installing') setProgress(100, INSTALL_MSG);
      else if (s.state === 'error') { showApplyError(s.message || '更新失败'); return; }
      else if (s.state === 'idle') { return; } // 非预期空闲态:停止轮询,避免空转
      setTimeout(poll, 800);
    }).catch(function () {
      // 连接断开 = 服务端已退出、进入安装阶段(预期现象)
      setProgress(100, INSTALL_MSG);
      setTimeout(poll, 2000);
    });
  }
})();
</script>
