{% extends "base.html" %}
{% block content %}
<h1>历史记录</h1>

<div class="filter-bar">
    <label>钱包：</label>
    <select id="wallet-filter" onchange="refreshHistory()">
        <option value="">全部</option>
    </select>
    <label>开始日期：</label>
    <input type="date" id="start-date" onchange="refreshHistory()">
    <label>结束日期：</label>
    <input type="date" id="end-date" onchange="refreshHistory()">
</div>

<h2>当前持仓（成本均价）</h2>
<p class="hint">数据来自 Polymarket 实时持仓（Data API）。成本价为该持仓的真实加权均价 avgPrice；已平仓的仓位不在此表，平仓动作见下方“卖单记录”。</p>
<table class="data-table">
    <thead>
        <tr>
            <th>钱包</th><th>市场</th><th>方向</th>
            <th>成本价</th><th>数量</th><th>现价</th><th>浮动盈亏</th><th>止损价</th>
        </tr>
    </thead>
    <tbody id="history-body"></tbody>
</table>

<h2 style="margin-top:2rem;">卖单记录</h2>
<table class="data-table">
    <thead>
        <tr>
            <th>时间</th><th>钱包</th><th>市场</th><th>动作</th>
            <th>价格</th><th>原因</th><th>价格依据/来源</th>
        </tr>
    </thead>
    <tbody id="sell-reasons-body"></tbody>
</table>
{% endblock %}

{% block scripts %}
<script>
function refreshHistory() {
    const wallet = document.getElementById('wallet-filter').value;
    const params = new URLSearchParams();
    if (wallet) params.set('wallet', wallet);

    fetch(`/api/positions?${params}`).then(r => r.json()).then(rows => {
        const body = document.getElementById('history-body');
        if (!rows.length) {
            body.innerHTML = '<tr><td colspan="8">暂无持仓</td></tr>';
        } else {
            body.innerHTML = rows.map(p => `
            <tr>
                <td title="${p.wallet}">${p.wallet.slice(0,6)}...${p.wallet.slice(-4)}</td>
                <td>${p.market_name}</td>
                <td class="buy-side">${p.outcome || '持有'}</td>
                <td>${p.buy_price.toFixed(4)}</td>
                <td>${p.size}</td>
                <td>${p.current_price.toFixed(4)}</td>
                <td class="${p.pnl >= 0 ? 'profit' : 'loss'}">${p.pnl.toFixed(2)}</td>
                <td>${p.stop_price.toFixed(4)}</td>
            </tr>
        `).join('');
        }
    });
    refreshSellReasons();
}

const ACTION_LABELS = {
    take_profit_sell: '止盈挂卖单',
    take_profit_recancel: '止盈撤旧改一笔',
    stoploss_market_sell: '止损市价卖',
    cancel_remainder: '撤成交剩余',
    stoploss_cancel_sell: '止损撤止盈卖',
    step3_cancel_old: 'Step3撤旧单',
    step3_replace_new: 'Step3重挂买',
    step3_cancel_nocompliant: 'Step3撤单(无合规价)',
    eligibility_cancel: '复查撤单(市场不合格)',
};

function refreshSellReasons() {
    const wallet = document.getElementById('wallet-filter').value;
    const startDate = document.getElementById('start-date').value;
    const endDate = document.getElementById('end-date').value;
    const params = new URLSearchParams();
    params.set('types',
        'take_profit_sell,take_profit_recancel,stoploss_market_sell,stoploss_cancel_sell');
    if (wallet) params.set('wallet', wallet);
    if (startDate) params.set('start', new Date(startDate).getTime() / 1000);
    if (endDate) params.set('end', new Date(endDate + 'T23:59:59').getTime() / 1000);

    fetch(`/api/actions?${params}`).then(r => r.json()).then(rows => {
        document.getElementById('sell-reasons-body').innerHTML = rows.map(a => `
            <tr>
                <td>${new Date(a.created_at * 1000).toLocaleString('zh-CN')}</td>
                <td title="${a.wallet}">${a.wallet.slice(0,6)}...${a.wallet.slice(-4)}</td>
                <td title="${a.market_id}">${a.market_id.slice(0,8)}...${a.market_id.slice(-6)}</td>
                <td>${ACTION_LABELS[a.action_type] || a.action_type}</td>
                <td>${a.price < 0 ? '-' : a.price.toFixed(4)}</td>
                <td>${a.reason}</td>
                <td>${a.price_basis}</td>
            </tr>
        `).join('');
    });
}

fetch('/api/wallets').then(r => r.json()).then(wallets => {
    const select = document.getElementById('wallet-filter');
    wallets.forEach(w => {
        const opt = document.createElement('option');
        opt.value = w.address;
        opt.textContent = `${w.address.slice(0,6)}...${w.address.slice(-4)}`;
        select.appendChild(opt);
    });
});

refreshHistory();
</script>
{% endblock %}
