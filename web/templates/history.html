{% extends "base.html" %}
{% block content %}
<h1>历史</h1>
<p class="metric-note">引擎动作记录：挂买、止盈/止损卖、撤改、复查/黑名单撤单等，按时间序，含逐笔成本构成（价格依据）。当前持仓在「挂单与持仓」页。</p>

<div class="filter-bar">
    <label>钱包：</label>
    <select id="wallet-filter" onchange="reload()">
        <option value="">全部</option>
    </select>
    <label>动作：</label>
    <select id="act-type" onchange="reload()">
        <option value="">全部</option>
    </select>
    <label>开始日期：</label>
    <input type="date" id="start-date" onchange="reload()">
    <label>结束日期：</label>
    <input type="date" id="end-date" onchange="reload()">
    <button class="btn btn-sm" onclick="reload()">刷新</button>
</div>

<div class="table-scroll">
<table class="data-table" style="table-layout:fixed;width:100%">
    <colgroup>
        <col style="width:13%"><col style="width:8%"><col style="width:11%">
        <col style="width:9%"><col style="width:6%"><col style="width:7%">
        <col style="width:6%"><col style="width:18%"><col style="width:22%">
    </colgroup>
    <thead>
        <tr>
            <th>时间</th><th>钱包</th><th>市场</th><th>动作</th>
            <th>方向</th><th>价格</th><th>数量</th>
            <th>原因</th><th>价格依据/来源</th>
        </tr>
    </thead>
    <tbody id="actions-body"></tbody>
</table>
</div>

<div class="pager" id="pager" style="margin-top:10px;display:none">
    <button class="btn btn-sm" id="prev-page" onclick="prevPage()">上一页</button>
    <span id="page-info" style="margin:0 10px"></span>
    <button class="btn btn-sm" id="next-page" onclick="nextPage()">下一页</button>
</div>
{% endblock %}

{% block scripts %}
<script>
function actionClass(a) {
    a = a || '';
    if (/replace|cancel|止损|跳过|stoploss/.test(a)) return 'loss';
    if (/成交|挂买|place_buy/.test(a)) return 'profit';
    return '';
}

const ACTION_LABELS = {
    place_buy: '挂买单',
    gap_skip: '策略判定不挂',   // 两种挂单模式共用这条动作,标签保持中性;具体哪套策略看「原因」列
    exit_rest: '离场挂卖单',
    exit_recancel: '离场撤旧改一笔',
    exit_cancel_sell: '清仓前撤卖单',
    exit_market: '市价离场(止盈/止损)',
    cancel_remainder: '撤成交剩余',
    step3_cancel_outofband: '复查撤单(盘口越界)',
    price_band_cancel: '复查撤单(价超区间)',
    eligibility_cancel: '复查撤单(市场不合格)',
    reward_drop_cancel: '奖励下降撤单',
    dropout_cancel: '跌出eligible撤单',
    side_pause_cancel: '成交后单侧暂停撤单',
    buy_reconcile_cancel: '撤改收敛撤单',
    blacklist_cancel: '黑名单撤单',
    uma_resolution_cancel: 'UMA结算撤买单',
};

const PAGE_SIZE = 100;
let currentPage = 1;
let totalPages = 1;

function reload() { currentPage = 1; refreshActions(); }
function prevPage() { if (currentPage > 1) { currentPage--; refreshActions(); } }
function nextPage() { if (currentPage < totalPages) { currentPage++; refreshActions(); } }

function refreshActions() {
    const wallet = document.getElementById('wallet-filter').value;
    const type = document.getElementById('act-type').value;
    const s = document.getElementById('start-date').value;
    const e = document.getElementById('end-date').value;
    const params = new URLSearchParams();
    if (wallet) params.set('wallet', wallet);
    if (type) params.set('types', type);
    if (s) params.set('start', new Date(s).getTime() / 1000);
    if (e) params.set('end', new Date(e + 'T23:59:59').getTime() / 1000);
    params.set('page', currentPage);
    params.set('page_size', PAGE_SIZE);

    fetch(`/api/actions?${params}`).then(r => r.json()).then(data => {
        const rows = data.rows || [];
        const total = data.total || 0;
        totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
        const body = document.getElementById('actions-body');
        const pager = document.getElementById('pager');
        if (!total) {
            body.innerHTML = '<tr><td colspan="9">暂无动作记录</td></tr>';
            pager.style.display = 'none';
            return;
        }
        body.innerHTML = rows.map(a => `
            <tr>
                <td>${escapeHtml(new Date(a.created_at * 1000).toLocaleString('zh-CN'))}</td>
                <td title="${escapeHtml(a.wallet)}">${escapeHtml(walletLabelOf(a.wallet))}</td>
                <td>${marketCell(a.market_name, a.market_id, a.market_url)}</td>
                <td class="${actionClass(a.action_type)}">${escapeHtml(ACTION_LABELS[a.action_type] || a.action_type)}</td>
                <td>${escapeHtml(a.side)}</td>
                <td>${a.price < 0 ? '-' : escapeHtml(a.price.toFixed(4))}</td>
                <td>${escapeHtml(a.size)}</td>
                <td>${escapeHtml(a.reason)}</td>
                <td>${escapeHtml(a.price_basis)}</td>
            </tr>
        `).join('');
        pager.style.display = '';
        document.getElementById('page-info').textContent =
            `第 ${currentPage} / ${totalPages} 页（共 ${total} 条）`;
        document.getElementById('prev-page').disabled = currentPage <= 1;
        document.getElementById('next-page').disabled = currentPage >= totalPages;
    });
}

(function () {
    const sel = document.getElementById('act-type');
    Object.entries(ACTION_LABELS).forEach(([k, v]) => {
        const opt = document.createElement('option');
        opt.value = k;
        opt.textContent = v;
        sel.appendChild(opt);
    });
})();

// 先等备注映射就绪再首渲染,否则表格会先闪一遍短地址再变备注。
fillWalletSelect(document.getElementById('wallet-filter')).then(refreshActions);
</script>
{% endblock %}
