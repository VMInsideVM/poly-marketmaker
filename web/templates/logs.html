{% extends "base.html" %}
{% block content %}
<h1>监控</h1>
<p class="metric-note">每 4 秒刷新的实时监控快照（瞬时状态，非持久记录）。动作历史在「历史」页。</p>

<div class="filter-bar">
    <label>钱包：</label>
    <select id="wallet-filter" onchange="refreshStatus()">
        <option value="">全部</option>
    </select>
    <span id="updated">最后更新：-</span>
    <button class="btn btn-sm" onclick="refreshStatus()">刷新</button>
</div>

<div class="table-scroll">
<table class="data-table">
    <thead>
        <tr>
            <th>时间</th><th>钱包</th><th>市场</th><th>方向</th>
            <th>价格</th><th>数量</th><th>已成交</th>
            <th>阶段</th><th>判定/动作</th><th>详情/原因</th>
        </tr>
    </thead>
    <tbody id="status-body"></tbody>
</table>
</div>
{% endblock %}

{% block scripts %}
<script>
function actionClass(a) {
    a = a || '';
    if (/replace|cancel|止损|跳过|stoploss/.test(a)) return 'loss';
    if (/成交/.test(a)) return 'profit';
    return '';
}

function refreshStatus() {
    fetch('/api/monitor-status').then(r => r.json()).then(data => {
        const upd = data.updated
            ? new Date(data.updated * 1000).toLocaleString('zh-CN') : '-';
        document.getElementById('updated').textContent = '最后更新：' + upd;
        const sel = document.getElementById('wallet-filter').value;
        const rows = (data.rows || []).filter(r => !sel || r.wallet === sel);
        const body = document.getElementById('status-body');
        if (!rows.length) {
            body.innerHTML =
                '<tr><td colspan="10">暂无在挂订单或监控未运行</td></tr>';
            return;
        }
        body.innerHTML = rows.map(r => {
            const t = r.ts
                ? new Date(r.ts * 1000).toLocaleString('zh-CN') : '';
            return `<tr>
                <td>${escapeHtml(t)}</td>
                <td title="${escapeHtml(r.wallet)}">${escapeHtml(walletLabelOf(r.wallet))}</td>
                <td>${marketCell(r.market_name, r.market, r.market_url)}</td>
                <td>${escapeHtml(r.side)}</td>
                <td>${escapeHtml(r.price)}</td>
                <td>${escapeHtml(r.size)}</td>
                <td>${escapeHtml(r.matched)}</td>
                <td>${escapeHtml(r.stage)}</td>
                <td class="${actionClass(r.action)}">${escapeHtml(r.action)}</td>
                <td>${escapeHtml(r.detail)}</td>
            </tr>`;
        }).join('');
    });
}

// 先等备注映射就绪再首渲染,否则表格会先闪一遍短地址再变备注。
fillWalletSelect(document.getElementById('wallet-filter')).then(() => {
    refreshStatus();
    setInterval(refreshStatus, 4000);
});
</script>
{% endblock %}
